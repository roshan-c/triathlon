name: Triathlon pull request sync

on:
  pull_request:
    types: [opened, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: triathlon-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  report-review:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Report linked tickets
        run: node ./bin/triathlon.js pr-event --event approved >> "$GITHUB_STEP_SUMMARY"

  update-board:
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'opened' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' &&
       github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.action == 'opened' && github.event.pull_request.head.ref || github.event.pull_request.base.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply pull-request transition
        run: node ./bin/triathlon.js pr-event
      - name: Commit board update
        run: |
          if git diff --quiet -- board.json board.html; then
            echo "Board already reflects this pull-request event."
            exit 0
          fi
          git config user.name "triathlon[bot]"
          git config user.email "triathlon[bot]@users.noreply.github.com"
          git add board.json board.html
          git commit -m "chore(board): sync PR #${{ github.event.pull_request.number }} [skip ci]"
          git push
