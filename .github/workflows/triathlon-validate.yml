name: Triathlon board

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run board:check
      - run: npm test
      - name: Validate linked tickets
        if: github.event_name == 'pull_request'
        run: node ./bin/triathlon.js pr-event --event approved >> "$GITHUB_STEP_SUMMARY"
